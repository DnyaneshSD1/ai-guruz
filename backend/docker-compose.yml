# Production-like backend on one machine: every service in its own container, on a private network,
# with only the gateway published. Copy .env.example to .env first.
#
#   docker compose up --build        (from this folder: backend only)
#   docker compose up --build        (from the repository root: backend + web)

x-service: &service
  restart: unless-stopped
  depends_on:
    mongo:
      condition: service_healthy
  environment: &env
    SPRING_PROFILES_ACTIVE: prod
    INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
    JWKS_URI: http://auth-service:8101/.well-known/jwks.json
    DOCUMENT_SERVICE_URL: http://document-service:8102
    CURRICULUM_SERVICE_URL: http://curriculum-service:8104
    LEARNING_SERVICE_URL: http://learning-service:8106
    ANALYTICS_SERVICE_URL: http://analytics-service:8107
    EVENTS_MODE: http
    AI_PROVIDER: ${AI_PROVIDER:-ollama}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-service:
    <<: *service
    build: { context: ., args: { SERVICE: auth-service } }
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/aiguruz_auth
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}

  document-service:
    <<: *service
    build: { context: ., args: { SERVICE: document-service } }
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/aiguruz_documents
      STORAGE_MODE: local
      STORAGE_LOCAL_DIR: /data/storage
    volumes:
      - document-data:/data/storage

  analysis-service:
    <<: *service
    build: { context: ., args: { SERVICE: analysis-service } }
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/aiguruz_analysis

  curriculum-service:
    <<: *service
    build: { context: ., args: { SERVICE: curriculum-service } }
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/aiguruz_curriculum

  assessment-service:
    <<: *service
    build: { context: ., args: { SERVICE: assessment-service } }
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/aiguruz_assessment

  learning-service:
    <<: *service
    build: { context: ., args: { SERVICE: learning-service } }
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/aiguruz_learning

  analytics-service:
    <<: *service
    build: { context: ., args: { SERVICE: analytics-service } }
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/aiguruz_analytics

  gateway:
    build: { context: ., args: { SERVICE: gateway } }
    restart: unless-stopped
    depends_on: [auth-service, document-service, analysis-service, curriculum-service, assessment-service, learning-service, analytics-service]
    ports:
      - "8080:8080"
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081}
      AUTH_SERVICE_URL: http://auth-service:8101
      DOCUMENT_SERVICE_URL: http://document-service:8102
      ANALYSIS_SERVICE_URL: http://analysis-service:8103
      CURRICULUM_SERVICE_URL: http://curriculum-service:8104
      ASSESSMENT_SERVICE_URL: http://assessment-service:8105
      LEARNING_SERVICE_URL: http://learning-service:8106
      ANALYTICS_SERVICE_URL: http://analytics-service:8107

volumes:
  mongo-data:
  document-data:
