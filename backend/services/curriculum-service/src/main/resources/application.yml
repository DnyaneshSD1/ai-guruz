server:
  port: ${PORT:8104}

spring:
  application:
    name: curriculum-service
  config:
    import: classpath:aiguruz-common.yml
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/aiguruz_curriculum}

aiguruz:
  research:
    enabled: ${RESEARCH_ENABLED:true}     # false = plan from the model's own knowledge only (fully offline)
    base-url: ${RESEARCH_BASE_URL:https://en.wikipedia.org}
