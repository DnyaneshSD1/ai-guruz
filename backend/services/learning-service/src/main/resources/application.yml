server:
  port: ${PORT:8106}

spring:
  application:
    name: learning-service
  config:
    import: classpath:aiguruz-common.yml
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/aiguruz_learning}

aiguruz:
  learning:
    advance-threshold: ${ADVANCE_THRESHOLD:0.8}     # quiz score needed to move straight on
    remedial-threshold: ${REMEDIAL_THRESHOLD:0.5}   # below this the module is re-taught
