AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Guruz - document text extraction (S3 upload -> extract -> callback to document service)

# Deploy with:  sam build && sam deploy --guided
# The function must be able to reach the document service, so it runs inside the same VPC.

Parameters:
  DocumentsBucketName:
    Type: String
    Description: Name for the bucket that stores uploaded documents (use the same value for STORAGE_S3_BUCKET)
  DocumentServiceUrl:
    Type: String
    Description: Internal URL of the document service, e.g. http://document-service.aiguruz.local:8102
  InternalApiKey:
    Type: String
    NoEcho: true
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>

Resources:
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DocumentsBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ExtractorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 1024
      Timeout: 120
      Environment:
        Variables:
          DOCUMENT_SERVICE_URL: !Ref DocumentServiceUrl
          INTERNAL_API_KEY: !Ref InternalApiKey
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DocumentsBucketName
      Events:
        Upload:
          Type: S3
          Properties:
            Bucket: !Ref DocumentsBucket
            Events: s3:ObjectCreated:*

Outputs:
  BucketName:
    Value: !Ref DocumentsBucket
